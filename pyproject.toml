[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-forge"
version = "2.0.0"
description = "Extract standalone MTP/NextN GGUFs and safely embed compatible MTP blocks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Verkiki"}]
keywords = ["mtp", "nextn", "gguf", "llama.cpp", "speculative-decoding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
mtp-forge = "mtp_forge.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/mtp-forge"
Issues = "https://github.com/YOUR_USERNAME/mtp-forge/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
